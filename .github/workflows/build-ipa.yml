name: Build Planner IPA
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Check date, gesture, and legacy data rules
        run: |
          swiftc Planner/Models.swift Tests/ModelChecks.swift -o /tmp/planner-model-checks
          /tmp/planner-model-checks
          swiftc Planner/Models.swift Planner/PlannerStore.swift Tests/StoreChecks.swift -o /tmp/planner-store-checks
          /tmp/planner-store-checks
      - name: Build iPhone app
        run: |
          xcodegen generate
          xcodebuild -project Planner.xcodeproj -scheme Planner -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/Planner.app dist/Payload/
          cd dist
          /usr/bin/zip -qry Planner.ipa Payload
          unzip -t Planner.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Planner-IPA
          path: dist/Planner.ipa
          if-no-files-found: error
