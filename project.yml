name: Planner
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '2.3.0'
    CURRENT_PROJECT_VERSION: '230'
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.21
targets:
  Planner:
    type: application
    platform: iOS
    sources:
      - path: Planner
        excludes: [Info.plist]
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalplanner.mvp
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Planner/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1'
  PlannerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PlannerTests]
    dependencies:
      - target: Planner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.personalplanner.mvp.tests
  PlannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PlannerUITests]
    dependencies:
      - target: Planner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.personalplanner.mvp.uitests
schemes:
  Planner:
    build:
      targets:
        Planner: all
        PlannerTests: [test]
        PlannerUITests: [test]
    test:
      targets: [PlannerTests, PlannerUITests]
      language: zh-Hant
      region: TW
