name: Planner
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '2.0.0'
    CURRENT_PROJECT_VERSION: '200'
targets:
  Planner:
    type: application
    platform: iOS
    sources: [Planner]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalplanner.mvp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Planner
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1'
  PlannerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PlannerTests]
    dependencies:
      - target: Planner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.personalplanner.mvp.tests
  PlannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PlannerUITests]
    dependencies:
      - target: Planner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.personalplanner.mvp.uitests
schemes:
  Planner:
    build:
      targets:
        Planner: all
        PlannerTests: [test]
        PlannerUITests: [test]
    test:
      targets: [PlannerTests, PlannerUITests]
      language: zh-Hant
      region: TW
