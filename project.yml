name: Planner
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.0.1'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Planner:
    type: application
    platform: iOS
    sources: [Planner]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalplanner.mvp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Planner
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1'
    scheme:
      build:
        targets:
          Planner: all
